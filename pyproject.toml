[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rhal"
version = "0.1.0"
description = "RobustHFT-AgentLab: defensive simulation framework for testing LLM-based trading agents under subtle financial misinformation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "BTP Student" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "pydantic>=2.5",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "tqdm>=4.66",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]
llm = ["anthropic>=0.30", "openai>=1.30"]
data = ["yfinance>=0.2.40"]
embed = ["sentence-transformers>=2.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
